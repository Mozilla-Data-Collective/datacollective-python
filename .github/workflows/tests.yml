name: Tests

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/**'
      - 'tests/**'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-tests:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          version: "latest"
          enable-cache: false

      - name: Install test dependencies
        run: uv pip install --system -e . --group dev

      - name: Run unit & integration tests (exclude e2e)
        run: pytest -v --ignore=tests/e2e tests

  run-e2e:
    needs: run-tests
    timeout-minutes: 30
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'release' && github.event.action == 'published')

    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          version: "latest"
          enable-cache: false

      - name: Install test dependencies
        run: uv pip install --system -e . --group dev

      - name: Run e2e tests
        env:
          MDC_TEST_API_KEY: ${{ secrets.MDC_TEST_API_KEY }}
          MDC_TEST_API_URL: ${{ secrets.MDC_TEST_API_URL }}
        run: pytest -q tests/e2e
