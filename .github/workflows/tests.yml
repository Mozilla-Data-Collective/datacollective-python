name: Tests

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/**'
      - 'tests/**'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-tests:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "latest"
          enable-cache: false

      - name: Install test dependencies
        run: uv pip install --system -e . --group dev

      - name: Run unit & integration tests (exclude e2e)
        run: pytest -v --ignore=tests/e2e tests

  run-e2e:
    needs: run-tests
    timeout-minutes: 30
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'release' && github.event.action == 'published')

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "latest"
          enable-cache: false

      - name: Install test dependencies
        run: uv pip install --system -e . --group dev

      - name: Run e2e tests
        env:
          MDC_TEST_API_KEY: ${{ secrets.MDC_TEST_API_KEY }}
          MDC_TEST_API_URL: ${{ secrets.MDC_TEST_API_URL }}
        run: pytest -q tests/e2e
