name: OpenAPI Contract Drift Detection

# Keeps tests/fixtures/openapi.json in sync with the production API. Every day it
# fetches the live spec and, when it differs from the committed snapshot, opens (or
# updates) a GitHub issue describing the drift and whether the contract test still
# passes against the new snapshot.
on:
  schedule:
    - cron: '0 6 * * *' # daily, 06:00 UTC
  workflow_dispatch:
    inputs:
      spec_url:
        description: Spec URL to refresh from (defaults to production)
        required: false
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: openapi-contract-refresh
  cancel-in-progress: false

jobs:
  detect-drift:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    env:
      # Same host the SDK talks to by default (DEFAULT_API_URL in api_utils.py).
      SPEC_URL: ${{ inputs.spec_url || 'https://mozilladatacollective.com/api/openapi.json' }}
      SNAPSHOT: tests/fixtures/openapi.json
      ISSUE_TITLE: Production OpenAPI contract is out of date with Python SDK
      ISSUE_LABEL: openapi-contract

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true

      - name: Install test dependencies
        run: uv pip install --system -e . --group dev

      - name: Fetch the live spec
        run: |
          # The platform serves the spec with a one-hour public cache; a unique query
          # string makes sure we read the currently deployed document.
          curl -sSfL "${SPEC_URL}?run=${GITHUB_RUN_ID}" | python -m json.tool > "$SNAPSHOT"
          if git diff --quiet -- "$SNAPSHOT"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Snapshot is up to date."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat -- "$SNAPSHOT"
            git --no-pager diff -- "$SNAPSHOT" > snapshot.diff
          fi
        id: fetch

      - name: Run the contract test against the new snapshot
        if: steps.fetch.outputs.changed == 'true'
        id: contract
        continue-on-error: true
        run: |
          pytest -q tests/test_openapi_contract.py 2>&1 | tee contract-output.txt
          exit "${PIPESTATUS[0]}"

      - name: Write the issue body
        if: steps.fetch.outputs.changed == 'true'
        env:
          OUTCOME: ${{ steps.contract.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # GitHub caps issue bodies at 65536 characters; keep the diff well under that.
          MAX_DIFF_LINES=400
          {
            echo "The live spec at \`$SPEC_URL\` differs from the committed snapshot \`$SNAPSHOT\`."
            echo
            if [ "$OUTCOME" = "success" ]; then
              echo "✅ The contract test passes against the new snapshot: the change is compatible with the SDK models. Refresh the snapshot and commit it."
            else
              echo "❌ The contract test fails against the new snapshot: the platform contract moved and the SDK models have to follow. Refresh the snapshot and fix the models (see docs/library_development.md)."
            fi
            echo
            echo "To refresh the snapshot locally:"
            echo
            echo '```sh'
            echo "curl -sSfL \"$SPEC_URL\" | python -m json.tool > $SNAPSHOT"
            echo "pytest -q tests/test_openapi_contract.py"
            echo '```'
            echo
            echo "<details><summary>pytest output</summary>"
            echo
            echo '```'
            cat contract-output.txt
            echo '```'
            echo "</details>"
            echo
            echo "<details><summary>Snapshot diff</summary>"
            echo
            echo '```diff'
            head -n "$MAX_DIFF_LINES" snapshot.diff
            if [ "$(wc -l < snapshot.diff)" -gt "$MAX_DIFF_LINES" ]; then
              echo
              echo "... diff truncated to $MAX_DIFF_LINES lines; see the workflow run for the full output."
            fi
            echo '```'
            echo "</details>"
            echo
            echo "Last checked by workflow run: $RUN_URL"
          } > issue-body.md

      - name: Open or update the issue
        if: steps.fetch.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh label create "$ISSUE_LABEL" --description "OpenAPI snapshot drift" --force
          existing="$(gh issue list --state open --label "$ISSUE_LABEL" --search "in:title \"$ISSUE_TITLE\"" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file issue-body.md
            echo "Updated issue #$existing."
          else
            gh issue create --title "$ISSUE_TITLE" --label "$ISSUE_LABEL" --body-file issue-body.md
          fi

      - name: Close the issue when the snapshot is back in sync
        if: steps.fetch.outputs.changed == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for n in $(gh issue list --state open --label "$ISSUE_LABEL" --search "in:title \"$ISSUE_TITLE\"" --json number --jq '.[].number'); do
            gh issue close "$n" --comment "The committed snapshot matches production again; closing automatically."
          done
