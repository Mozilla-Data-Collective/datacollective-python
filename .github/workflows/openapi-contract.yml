name: OpenAPI Contract Drift Detection

# Keeps tests/fixtures/openapi.json in sync with the production API. Every day it
# fetches the live spec and, when it differs from the committed snapshot, opens (or
# updates) a pull request with the new snapshot. The PR's own CI runs the contract test,
# so a green PR is a harmless contract change to merge, and a red PR shows exactly what
# moved and which SDK model has to follow. Nothing here gates the platform's merges.
on:
  schedule:
    - cron: '0 6 * * *' # daily, 06:00 UTC
  workflow_dispatch:
    inputs:
      spec_url:
        description: Spec URL to refresh from (defaults to production)
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: openapi-contract-refresh
  cancel-in-progress: false

jobs:
  refresh-snapshot:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    env:
      # Same host the SDK talks to by default (DEFAULT_API_URL in api_utils.py).
      SPEC_URL: ${{ inputs.spec_url || 'https://mozilladatacollective.com/api/openapi.json' }}
      SNAPSHOT: tests/fixtures/openapi.json

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true

      - name: Install test dependencies
        run: uv pip install --system -e . --group dev

      - name: Fetch the live spec
        run: |
          # The platform serves the spec with a one-hour public cache; a unique query
          # string makes sure we read the currently deployed document.
          curl -sSfL "${SPEC_URL}?run=${GITHUB_RUN_ID}" | python -m json.tool > "$SNAPSHOT"
          if git diff --quiet -- "$SNAPSHOT"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Snapshot is up to date."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat -- "$SNAPSHOT"
          fi
        id: fetch

      # Run here as well as in the PR's CI: this gives the result even when the PR is
      # opened with the default token, which cannot trigger other workflows.
      - name: Run the contract test against the new snapshot
        if: steps.fetch.outputs.changed == 'true'
        id: contract
        continue-on-error: true
        run: |
          pytest -q tests/test_openapi_contract.py 2>&1 | tee contract-output.txt
          exit "${PIPESTATUS[0]}"

      - name: Write the pull request body
        if: steps.fetch.outputs.changed == 'true'
        env:
          OUTCOME: ${{ steps.contract.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "Automated refresh of \`$SNAPSHOT\` from \`$SPEC_URL\`."
            echo
            if [ "$OUTCOME" = "success" ]; then
              echo "✅ The contract test passes against the new snapshot: the change is compatible with the SDK models. Review the diff and merge."
            else
              echo "❌ The contract test fails against the new snapshot: the platform contract moved and the SDK models have to follow. Fix the models on this branch (see docs/library_development.md)."
            fi
            echo
            echo "<details><summary>pytest output</summary>"
            echo
            echo '```'
            cat contract-output.txt
            echo '```'
            echo "</details>"
            echo
            echo "Workflow run: $RUN_URL"
          } > pr-body.md

      - name: Open or update the pull request
        if: steps.fetch.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          # Optional: a fine-grained PAT (contents + pull-requests: write) so the PR
          # triggers tests.yml like a human-made PR would. Falls back to the default
          # token, in which case only the inline result above is available.
          token: ${{ secrets.OPENAPI_REFRESH_TOKEN || github.token }}
          add-paths: tests/fixtures/openapi.json
          branch: chore/refresh-openapi-snapshot
          delete-branch: true
          commit-message: Refresh OpenAPI snapshot from production
          title: Refresh OpenAPI snapshot from production
          body-path: pr-body.md
          labels: openapi-contract
